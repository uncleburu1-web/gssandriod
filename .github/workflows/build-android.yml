name: Build Android APK

# Runs automatically every time you push to main, and can also be
# triggered manually from the Actions tab with the "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so this workflow's own GITHUB_TOKEN is allowed to create a
# Release (the default token is read-only on some repos/orgs).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (needed by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app (Vite)
        run: npm run build
        env:
          VITE_API_URL: https://gss-production.up.railway.app/api

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Decode the release keystore
        working-directory: android/app
        run: echo "${{ secrets.GSS_ANDROID_KEYSTORE_BASE64 }}" | base64 -d > gss-release.keystore

      # Every build gets its own always-increasing versionCode from this
      # workflow's own run number — Android will not install an "update"
      # whose versionCode isn't strictly greater than what's already on
      # the device, so this can't be a fixed number if updates are meant
      # to work. versionName is just the human-readable label the app
      # reports to the update-checker (see src/utils/appUpdate.js).
      - name: Build signed release APK
        working-directory: android
        env:
          GSS_KEYSTORE_PATH: gss-release.keystore
          GSS_KEYSTORE_PASSWORD: ${{ secrets.GSS_ANDROID_KEYSTORE_PASSWORD }}
          GSS_KEY_ALIAS: gss
          GSS_VERSION_CODE: ${{ github.run_number }}
          GSS_VERSION_NAME: "1.${{ github.run_number }}"
        run: chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Remove the keystore from the runner
        if: always()
        working-directory: android/app
        run: rm -f gss-release.keystore

      - name: Rename the APK to a stable filename
        # A fixed name means the download link on the website
        # (…/releases/latest/download/gss-android.apk) never has to change.
        run: cp android/app/build/outputs/apk/release/app-release.apk gss-android.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "GSS Android v1.${{ github.run_number }}"
          files: gss-android.apk
